---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique
  sources:
    - repoURL: us-docker.pkg.dev/online-boutique-ci/charts
      chart: onlineboutique
      targetRevision: 0.10.7
      helm:
        releaseName: online-boutique
        valueFiles:
          - $values/argocd/values/online-boutique.yaml
    - repoURL: https://github.com/khalid-gh/gcp-microservices-demo.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
